<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chat de consulta sobre inventario, respaldado por el agente de IA." />
    <title>Agente de Inventario</title>
    <script>
      // Aplica el tema antes del primer pintado para evitar el parpadeo blanco.
      (function () {
        try {
          var stored = localStorage.getItem('agente-inventario.theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
