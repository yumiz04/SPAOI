server {
    listen 80;
    # Sin esta linea nginx solo escucha en IPv4 y las sondas que resuelven localhost
    # a ::1 fallan con "connection refused".
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # El agente puede tardar entre 10 y 120 s en responder: sin esto nginx corta la
    # conexion a los 60 s y la UI muestra un error aunque el agente este trabajando.
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    # Mismo prefijo que usa el proxy de Vite en desarrollo, para que el codigo del
    # cliente no cambie entre desarrollo y produccion.
    location /agent/ {
        proxy_pass http://agent:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # El index no se cachea para que un despliegue nuevo se vea al recargar.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Los assets llevan hash en el nombre, asi que se cachean para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router: cualquier ruta desconocida devuelve la app para que el cliente
    # resuelva el enrutado.
    location / {
        try_files $uri $uri/ /index.html;
    }
}